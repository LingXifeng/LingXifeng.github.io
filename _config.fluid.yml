# Fluid 主题配置
# 文档: https://hexo-fluid.github.io/hexo-fluid-doc/

# ---------- 全局 ----------
blog_title: LingXifeng
favicon: /img/fluid.png
apple_touch_icon: /img/fluid.png

# ---------- canonical 链接 (SEO) ----------
# 告诉搜索引擎文章的权威地址，避免重复内容惩罚
canonical:
  enable: true

# ---------- 访问分析 ----------
# 需要填写真实的 ID 才能生效，下方两种任选其一
# Google Analytics: https://support.google.com/analytics/answer/9744165
# Umami (自建): 在 web_analytics 中配置 umami 参数
web_analytics:
  enable: false  # 拿到 ID 后改为 true
  follow_dnt: true
  google:
    measurement_id:  # 填入 Google Analytics 的 G-XXXXXXXXXX
  leancloud:
    app_id:
    app_key:
    server_url:
    path: window.location.pathname

# 导航栏
navbar:
  blog_title: LingXifeng
  menu:
    - { key: "首页", link: "/", icon: "iconfont icon-homefill" }
    - { key: "归档", link: "/archives/", icon: "iconfont icon-archive" }
    - { key: "分类", link: "/categories/", icon: "iconfont icon-category" }
    - { key: "标签", link: "/tags/", icon: "iconfont icon-tag" }
    - { key: "友链", link: "/links/", icon: "iconfont icon-link" }
    - { key: "关于", link: "/about/", icon: "iconfont icon-user" }
  # 导航栏毛玻璃效果（实验性功能）
  ground_glass:
    enable: true

# ---------- 趣味功能 ----------
fun_features:
  typing:
    enable: true
    typeSpeed: 70
    cursorChar: "_"
    loop: false
    scope: []
  anchorjs:
    enable: true
    element: h1,h2,h3,h4,h5,h6
    placement: left
    visible: hover
    icon: ""
  progressbar:
    enable: true
    height_px: 3
    color: "#29d"
    options: { showSpinner: false, trickleSpeed: 100 }

# ---------- 暗黑模式 ----------
dark_mode:
  enable: true
  default: auto

# ---------- 懒加载 ----------
lazyload:
  enable: true
  onlypost: false
  loading: /img/loading.gif

# ---------- 搜索 ----------
search:
  enable: true
  path: /local-search.xml
  generate_path: /local-search.xml
  field: post
  content: true

# ---------- 首页 ----------
index:
  banner_img: /img/default.png
  banner_img_height: "80"
  slogan:
    text: "保持好奇，持续学习"
    hitokoto: false
  post_url: false
  post_default_bg:
    - /img/default.png
  intro:
    enable: true
    icons:
      - { class: "iconfont icon-github", link: "https://github.com/LingXifeng", text: "GitHub" }
    text: "你好，我是 LingXifeng。这里记录我的学习笔记和技术想法。"

# ---------- 文章 ----------
post:
  banner_img: /img/default.png
  banner_img_height: "60"
  default_index_img: /img/default.png

  meta:
    author:
      enable: true
    date:
      enable: true
      format: "LL a"
    wordcount:
      enable: true
    min2read:
      enable: true
      awl: 2
      wpm: 60
    views:
      enable: true
      source: "busuanzi"

  updated:
    enable: true
    date_format: "LL a"
    relative: false

  category_bar:
    enable: true
    specific: true
    placement: left
    post_order_by: "title"
    post_limit: 0

  toc:
    enable: true
    placement: right
    headingSelector: "h1,h2,h3,h4,h5,h6"
    collapseDepth: 0

  copyright:
    enable: true
    license: 'BY-NC-SA'
    author:
      enable: true
    post_date:
      enable: true
      format: "LL"
    update_date:
      enable: true
      format: "LL"

  prev_next:
    enable: true

  image_caption:
    enable: true

  image_zoom:
    enable: true
    img_url_replace: ['', '']

  footnote:
    enable: true
    header: ''

  # 数学公式
  math:
    enable: true
    specific: true
    engine: katex

  # Mermaid 流程图
  mermaid:
    enable: true
    specific: true
    options: { theme: 'default' }

  # 评论系统
  # 可选值：gitalk | giscus | valine | utterances | disqus | waline | twikoo 等
  # 推荐用 giscus（基于 GitHub Discussions，不需要 Client Secret）
  # 用 giscus 前需：1) 仓库开启 Discussions  2) 安装 giscus app  3) 填下方 giscus 配置
  # 然后把 type 改为 giscus 即可
  comments:
    enable: true
    type: gitalk    # 想用 Giscus 时改为 giscus

# ---------- Gitalk 评论 ----------
gitalk:
  clientID: your-client-id
  clientSecret: your-client-secret
  repo: LingXifeng.github.io
  owner: LingXifeng
  admin: ['LingXifeng']
  language: zh-CN
  labels: ['Gitalk']
  perPage: 10
  pagerDirection: last
  distractionFreeMode: false
  createIssueManually: true
  proxy: https://cors-anywhere.azm.workers.dev/https://github.com/login/oauth/access_token

# ---------- Giscus 评论（推荐，基于 GitHub Discussions）----------
# 配置步骤：
# 1. 在 GitHub 仓库 Settings → Features 勾选 Discussions
# 2. 访问 https://github.com/apps/giscus/installations/new 安装 giscus app 到本仓库
# 3. 访问 https://giscus.app 填入仓库信息，生成下方配置参数
# 4. 把上方 post.comments.type 改为 giscus
giscus:
  repo: LingXifeng/LingXifeng.github.io
  repo_id:              # 在 https://giscus.app 生成
  category: Announcements
  category_id:          # 在 https://giscus.app 生成
  mapping: pathname
  reactions_enabled: 1
  theme: light
  lang: zh-CN
  input_position: top   # 评论框在上方

# ---------- 归档 ----------
archive:
  banner_img: /img/default.png
  banner_img_height: "60"

# ---------- 分类 ----------
category:
  banner_img: /img/default.png
  banner_img_height: "60"

# ---------- 标签 ----------
tag:
  banner_img: /img/default.png
  banner_img_height: "60"

# ---------- 关于 ----------
about:
  enable: true
  banner_img: /img/default.png
  banner_img_height: "60"
  avatar: /img/avatar.png
  name: "LingXifeng"
  intro: "保持好奇，持续学习"
  icons:
    - { class: "iconfont icon-github", link: "https://github.com/LingXifeng", text: "GitHub" }

# ---------- 友情链接 ----------
links:
  enable: true
  banner_img: /img/default.png
  banner_img_height: "60"
  items:
    - {
      title: "Fluid Blog",
      intro: "主题博客",
      link: "https://hexo.fluid-dev.com/",
      avatar: "/img/favicon.png"
    }
    - {
      title: "Hexo 官网",
      intro: "Hexo 静态博客框架",
      link: "https://hexo.io/",
      avatar: "/img/favicon.png"
    }
  onerror_avatar: /img/avatar.png
  custom:
    enable: true
    content: '<hr><p>想交换友链？在关于页面找到我的联系方式，按如下格式提供信息：</p><ul><li>博客名：你的博客名</li><li>简介：一句话介绍</li><li>链接：你的博客地址</li></ul>'

# ---------- 页脚 ----------
footer:
  content: '
    <a href="https://hexo.io" target="_blank" rel="noopener">Hexo</a>
    |
    <a href="https://github.com/fluid-dev/hexo-theme-fluid" target="_blank" rel="noopener">Fluid Theme</a>
  '
  # 页脚展示全站 PV / UV 统计
  statistics:
    enable: true
    source: "busuanzi"    # 不需要额外服务；想要更稳定可用 leancloud/umami

# ---------- 自定义 ----------
custom_css: []
custom_js: []
