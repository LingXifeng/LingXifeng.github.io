# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: LingXifeng
subtitle: '学习笔记 & 技术想法'
description: '个人主页 - 记录学习历程与技术思考'
keywords: 博客,技术,学习笔记
author: LingXifeng
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://lingxifeng.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: ''

# ---------- 插件配置 ----------

# 本地搜索
search:
  path: /local-search.xml
  field: post
  content: true

# RSS 订阅
feed:
  enable: true
  type: atom
  path: /atom.xml
  limit: 20
  content: true
  content_limit: 200
  content_limit_delim: ' '

# Sitemap
sitemap:
  path: /sitemap.xml
