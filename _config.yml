# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: LingXifeng
subtitle: '学习笔记 & 技术想法'
description: '个人主页 - 记录学习历程与技术思考'
keywords: 博客,技术,学习笔记
author: LingXifeng
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://lingxifeng.github.io
# 使用 abbrlink 生成永久链接，改标题/日期不会导致 URL 变化
permalink: posts/:abbrlink/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# abbrlink 永久链接配置
abbrlink:
  alg: crc32      # 算法: crc16 | crc32
  rep: hex        # 表示: dec | hex

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
# 开启文章资源文件夹：hexo new "标题" 时自动创建同名文件夹放图片
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: fluid

# Deployment
deploy:
  type: ''

# ---------- 插件配置 ----------

# 本地搜索
search:
  path: /local-search.xml
  field: post
  content: true

# RSS 订阅
feed:
  enable: true
  type: atom
  path: /atom.xml
  limit: 20
  content: true
  content_limit: 2000       # 调大：让 RSS 阅读器能看到几乎全文
  content_limit_delim: ' '

# Sitemap
sitemap:
  path: /sitemap.xml

# ---------- robots.txt (hexo-generator-robotstxt) ----------
# 生成 robots.txt 指引搜索引擎爬虫
robotstxt:
  robotstxt:
    body: |
      User-agent: *
      Allow: /
      Disallow: /js/
      Disallow: /css/
      Disallow: /img/
      Sitemap: https://lingxifeng.github.io/sitemap.xml

# ---------- GitHub Emoji (hexo-filter-github-emojis) ----------
# 在 Markdown 中写 :rocket: :bug: :tada: 等自动渲染为 emoji
githubEmojis:
  enable: true
  className: github-emoji
  unicode: false        # false = 用图片，true = 用 Unicode 字符
  localEmojis:

# ---------- HTML 压缩 (hexo-html-minifier) ----------
html_minifier:
  silent: true
  exclude:
    - '**/atom.xml'
    - '**/sitemap.xml'
    - '**/local-search.xml'

# ---------- CSS 压缩 (hexo-clean-css) ----------
clean_css:
  exclude:
    - '**/atom.xml'
    - '**/sitemap.xml'

# ---------- 文章加密 (hexo-blog-encrypt) ----------
# 在文章 Front-matter 中加 password: xxx 即可加密该篇文章
encrypt:
  abstract: 这篇文章已加密，请输入密码查看。
  message: 请输入密码：
  wrong_pass_message: 抱歉，密码不对，请重试。
  wrong_hash_message: 抱歉，文章内容校验失败，请检查。

# ---------- 外链 nofollow (hexo-filter-nofollow) ----------
# 告诉搜索引擎不要追踪外部链接，提升 SEO
nofollow:
  enable: true
  exclude:
    - lingxifeng.github.io    # 自己的域名不加 nofollow
